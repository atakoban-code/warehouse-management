.fpback{position:fixed;inset:0;z-index:999;background:rgba(20,30,50,.45);display:flex;align-items:flex-end;justify-content:center;animation:fpf .18s ease}.fpsheet{width:100%;max-width:520px;max-height:78vh;display:flex;flex-direction:column;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(20,30,50,.25);animation:fpu .22s ease}.fph{width:38px;height:4px;border-radius:2px;background:#d5dae4;margin:9px auto 4px}.fpt{padding:6px 18px 8px;font-weight:800;font-size:15px;color:var(--ink)}.fpq{padding:0 14px 10px}.fpl{overflow-y:auto;border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom))}.fpo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink);cursor:pointer}.fpo.on{background:#f1f6ff;font-weight:700}.fpo i{flex:none;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}.fpo i svg{width:12px;height:12px}.fpe{padding:18px;text-align:center;color:var(--muted);font-size:13px}
@keyframes fpu{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}@keyframes fpf{from{opacity:0}to{opacity:1}}

.gm{display:grid;grid-template-columns:repeat(3,1fr);margin:0 0 6px;border:1.5px solid #c8a66a;border-radius:22px;background:linear-gradient(135deg,#fbf3e0,#f1dfb4 55%,#e2c280);box-shadow:0 8px 20px rgba(185,138,58,.22);overflow:hidden}.gm>div{padding:14px 16px;border-right:1px solid rgba(139,102,36,.28)}.gm>div:last-child{border-right:0}.gm small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;color:#8b6624;text-transform:uppercase}.gm b{display:block;margin-top:4px;font-size:28px;color:#3b2c0e}.gm .rd b{color:#a33a48}.gm .gn b{color:#1d7a63}
.gs{border:1.5px solid #c8a66a;border-radius:18px;background:linear-gradient(135deg,#fbf3e0,#f1dfb4);padding:12px 16px;margin-bottom:10px}.gs .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.gs small{font-size:12px;font-weight:700;color:#8b6624}.gs b{font-size:22px;color:#3b2c0e}.gs .m{color:#a33a48}.gs .p{color:#1d7a63}
</style></head>

<script>
const KEY='warehouse-management-v1';
const initial={products:[],stocks:{'Gudang Ende':{},'Gudang Canvas':{}},counts:[],transactions:[],minusCases:[],gm:{},plusCases:[],activities:[],movements:[]};
let db=load(),page='dashboard',activeWarehouse='Gudang Ende',countDraft={productId:null,physical:0},calc={dasar:0,tinggi:0,stapel:0,addDos:0,addRoll:0,subDos:0,subRoll:0,mulDos:0,mulRoll:0};
function load(){try{let d={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')};d.stocks=d.stocks||{'Gudang Ende':{},'Gudang Canvas':{}};d.stocks['Gudang Ende']=d.stocks['Gudang Ende']||{};d.stocks['Gudang Canvas']=d.stocks['Gudang Canvas']||{};d.movements=d.movements||[];d.products=(d.products||[]).map(p=>({...p,category:p.category||'Umum',unit:p.unit||'Roll',purchasePrice:Number(p.purchasePrice||0),sellPrice:Number(p.sellPrice||0),isi:Number(p.isi||0)}));d.products.forEach(p=>{if(d.stocks['Gudang Ende'][p.id]===undefined)d.stocks['Gudang Ende'][p.id]=0;if(d.stocks['Gudang Canvas'][p.id]===undefined)d.stocks['Gudang Canvas'][p.id]=0});return d}catch(e){return structuredClone(initial)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:3})}
function stock(w,id){return Number(db.stocks[w]?.[id]||0)}
function totalStock(id){return stock('Gudang Ende',id)+stock('Gudang Canvas',id)}
function allStock(w){return db.products.reduce((a,p)=>a+(w==='Gabungan'?totalStock(p.id):stock(w,p.id)),0)}
function title(t,s='',k){return `<div class="pagehead"><div><h2>${t}</h2>${k?`<div class="sub">${s}</div>`:''}<div class="goldline"></div></div></div>`}
function field(label,name,placeholder='',type='text'){return `<label><span class="label">${label}</span><input class="field" name="${name}" placeholder="${placeholder}" type="${type}"></label>`}
function wh(){return document.getElementById('globalWarehouse').value}
function render(){activeWarehouse=wh();pills();hdr();document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));let root=document.getElementById('main');root.innerHTML=({dashboard:dashboard,products:products,count:count,more:more,stock:stockPage,minus:minusPage,plus:plusPage,transactions:transactionsPage,masuk:()=>ioPage('masuk'),keluar:()=>ioPage('keluar'),history:historyPage,compare:comparePage})[page]();bind()}
function dashboard(){let w=wh(),e=allStock('Gudang Ende'),c=allStock('Gudang Canvas'),tot=e+c,v=w==='Gabungan'?tot:w==='Gudang Ende'?e:c,lab=w==='Gabungan'?'TOTAL STOK GABUNGAN':'STOK '+w.toUpperCase(),ep=w==='Gudang Canvas'?0:w==='Gudang Ende'?100:(tot?Math.round(e/tot*100):0),cp=w==='Gudang Ende'?0:w==='Gudang Canvas'?100:(tot?100-ep:0),mn=gmList('minus').length,pl=gmList('plus').length;
return `<div class="gm"><div><small>Produk</small><b>${db.products.length}</b></div><div class="rd"><small>Minus</small><b>${mn}</b></div><div class="gn"><small>Plus</small><b>${pl}</b></div></div>
<div class="sh"><div class="shl"><i></i><div><b>Akses cepat</b><u></u></div></div><button class="lsa" data-go="more">Lihat Semua ›</button></div><div class="tiles">${menu('','Produk','products')}${menu('','Data Stok','stock')}${menu('','Cek Fisik','count')}${menu('','Masuk','masuk')}${menu('','Keluar','keluar')}${menu('','Transaksi','transactions')}${menu('','Minus','minus')}${menu('','Plus','plus')}${menu('','Riwayat','history')}${menu('','Excel','compare')}</div><div class="sh" style="margin-top:26px"><div class="shl"><i></i><div><b>Aktivitas terbaru</b></div></div></div><div class="card">${actBlocks()}</div>`}
function dashboardOld(){return `${title('Dashboard','Ringkasan persediaan dan aktivitas gudang')}<div class="grid">
<div class="stat"><div class="ico">📦</div><div class="num">${db.products.length}</div><small>Total Produk</small></div>
<div class="stat"><div class="ico">🏬</div><div class="num">${fmt(allStock('Gudang Ende'))}</div><small>Stok Gudang Ende</small></div>
<div class="stat"><div class="ico">🏢</div><div class="num">${fmt(allStock('Gudang Canvas'))}</div><small>Stok Gudang Canvas</small></div>
<div class="stat gold"><div class="ico">✨</div><div class="num">${fmt(allStock('Gabungan'))}</div><small>Total Stok Gabungan</small></div></div>
<div class="sectiontitle">Akses cepat</div><div class="menu-grid">
${menu('📦','Data Produk','products')}${menu('📊','Data Stok','stock')}${menu('🧮','Cek Stok Fisik','count')}${menu('📉','Barang Minus','minus')}${menu('📈','Barang Plus','plus')}${menu('🛒','Transaksi','transactions')}${menu('🧾','Riwayat','history')}${menu('📑','Banding Excel','compare')}
</div><div class="sectiontitle">Aktivitas terbaru</div><div class="card">${actBlocks()}</div>`}
const TI={products:['gold','<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" fill="rgba(255,255,255,.3)"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>'],
stock:['blue','<rect x="3.5" y="12" width="4.5" height="8.5" rx="1.4" fill="#fff" fill-opacity=".6" stroke="none"/><rect x="9.75" y="7" width="4.5" height="13.5" rx="1.4" fill="#fff" fill-opacity=".8" stroke="none"/><rect x="16" y="3" width="4.5" height="17.5" rx="1.4" fill="#fff" stroke="none"/>'],
count:['teal','<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" fill="rgba(255,255,255,.3)"/><rect x="8" y="2" width="8" height="4" rx="1.2" fill="#fff"/><path d="m9 14 2.2 2.2L15.5 12"/>'],
transactions:['purple','<path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" fill="rgba(255,255,255,.3)"/><circle cx="9" cy="20.5" r="1.4" fill="#fff"/><circle cx="18" cy="20.5" r="1.4" fill="#fff"/>'],
minus:['red','<path d="M3 7l6.5 6.5 4-4L21 17" stroke-width="2.2"/><path d="M15 17h6v-6" stroke-width="2.2"/>'],
plus:['green','<path d="M3 17l6.5-6.5 4 4L21 7" stroke-width="2.2"/><path d="M15 7h6v6" stroke-width="2.2"/>'],
history:['orange','<circle cx="12" cy="12" r="9.5" fill="rgba(255,255,255,.3)"/><path d="M12 6.5V12l3.8 2.2"/>'],
compare:['navy','<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" fill="rgba(255,255,255,.3)"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h2.5"/><path d="M13.5 13H16"/><path d="M8 17h2.5"/><path d="M13.5 17H16"/>']};
Object.assign(TI,{products:['gold','<polygon points="12,2.5 20.5,7.2 12,11.9 3.5,7.2" fill="#fff" stroke="none"/><polygon points="3.5,9 11,13.2 11,21.5 3.5,17.2" fill="#fff" fill-opacity=".86" stroke="none"/><polygon points="20.5,9 13,13.2 13,21.5 20.5,17.2" fill="#fff" fill-opacity=".7" stroke="none"/>'],
stock:['blue','<rect x="3.5" y="12" width="4.6" height="8.5" rx="1.5" fill="#fff" stroke="none"/><rect x="9.7" y="7.5" width="4.6" height="13" rx="1.5" fill="#fff" stroke="none"/><rect x="15.9" y="3" width="4.6" height="17.5" rx="1.5" fill="#fff" stroke="none"/>'],
count:['green','<rect x="4.5" y="4" width="15" height="17.5" rx="3" fill="#fff" stroke="none"/><rect x="8.5" y="2" width="7" height="4.4" rx="1.6" fill="#fff" stroke="#17c065" stroke-width="1.2"/><path d="m8.4 13.6 2.7 2.7 4.7-5" stroke="#17b05c" stroke-width="2.4"/>'],
transactions:['purple','<path d="M2.5 3.5h2.4l2.3 10.4a1.6 1.6 0 0 0 1.6 1.3h8.9a1.6 1.6 0 0 0 1.55-1.2L21.5 7H6" fill="#fff" fill-opacity=".92" stroke-width="2"/><circle cx="9.3" cy="19.8" r="1.7" fill="#fff" stroke="none"/><circle cx="17.7" cy="19.8" r="1.7" fill="#fff" stroke="none"/><path d="M8.4 10h10.2" stroke="#7c3aed" stroke-width="1.4"/>'],
minus:['red','<path d="M3.5 6.5l6 6 3.5-3.5 6.5 6.5" stroke-width="2.8"/><path d="M14.5 16h5.5v-5.5" stroke-width="2.8"/>'],
plus:['teal','<rect x="3.5" y="15" width="4.2" height="5.5" rx="1.3" fill="#fff" stroke="none"/><rect x="9.9" y="12" width="4.2" height="8.5" rx="1.3" fill="#fff" stroke="none"/><rect x="16.3" y="9" width="4.2" height="11.5" rx="1.3" fill="#fff" stroke="none"/><path d="M3.5 10.5c4-.5 7-2.5 10-6" stroke-width="2.4"/><path d="M12.2 3.8h5.3v5.3" stroke-width="2.4"/>'],
history:['orange','<path d="M3 12a9 9 0 1 0 2.8-6.5L3 8" stroke-width="2.4"/><path d="M3 3v5h5" stroke-width="2.4"/><path d="M12 7v5.2l3.6 2" stroke-width="2.4"/>'],
compare:['navy','<path d="M6 2.5h8l5 5V20a1.8 1.8 0 0 1-1.8 1.8H6A1.8 1.8 0 0 1 4.2 20V4.3A1.8 1.8 0 0 1 6 2.5Z" fill="#fff" fill-opacity=".14" stroke-width="2.2"/><path d="M14 2.7v4.3a.8.8 0 0 0 .8.8H19" stroke-width="2.2"/><path d="M8 12h8" stroke-width="2.2"/><path d="M8 15.5h8" stroke-width="2.2"/><path d="M8 8.8h3" stroke-width="2.2"/>']});
TI.masuk=['green','<path d="M12 3v10" stroke-width="2.6"/><path d="M7.5 9l4.5 4.5L16.5 9" stroke-width="2.6"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4" stroke-width="2.4"/>'];TI.keluar=['orange','<path d="M12 14V4" stroke-width="2.6"/><path d="M7.5 8L12 3.5 16.5 8" stroke-width="2.6"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4" stroke-width="2.4"/>'];
function menu(i,t,p){let c=TI[p]||['gold','<circle cx="12" cy="12" r="9"/>'];return `<button class="tile" data-go="${p}"><span class="ti ${c[0]}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${c[1]}</svg></span><em>${t}</em></button>`}
function pills(){let w=wh(),b=document.getElementById('whBar');b.innerHTML=['Gudang Ende','Gudang Canvas','Gabungan'].map(x=>`<button class="wp ${x===w?'on':''}" data-wset="${x}">${x}</button>`).join('');b.querySelectorAll('[data-wset]').forEach(el=>el.onclick=()=>{document.getElementById('globalWarehouse').value=el.dataset.wset;render()})}
function hdr(){let d=new Date(),h=d.getHours();document.getElementById('hdrDate').textContent=d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short'});document.getElementById('hdrHi').textContent=h<11?'Selamat pagi':h<15?'Selamat siang':h<19?'Selamat sore':'Selamat malam'}
function more(){return `${title('Semua Menu','Pilih fitur yang ingin dibuka')}<div class="tiles">${menu('📦','Data Produk','products')}${menu('📊','Data Stok','stock')}${menu('🧮','Cek Stok Fisik','count')}${menu('📉','Barang Minus','minus')}${menu('📈','Barang Plus','plus')}${menu('📥','Barang Masuk','masuk')}${menu('📤','Barang Keluar','keluar')}${menu('🔁','Penjualan & Transfer','transactions')}${menu('🧾','Riwayat & Laporan','history')}${menu('📑','Perbandingan Excel','compare')}</div>`}
function products(){return `${title('Data Produk','Master produk untuk kedua gudang')}<div class="card"><div class="row"><input id="psearch" class="field" placeholder="Cari kode atau nama produk..."><button class="btn primary" id="addProduct">＋ Produk</button></div><div class="actions" style="margin-top:10px"><button class="btn" id="exportProducts">Ekspor CSV</button><label class="btn">Impor CSV/Excel<input id="importProducts" type="file" accept=".csv,.xlsx,text/csv" hidden></label></div></div><div class="card" id="productRows">${productRows()}</div>`}
function productRows(){return db.products.map(p=>blk(esc(p.name),esc(p.code),[['18% 22% 30% 30%',[cell('Ende '+fmt(stock('Gudang Ende',p.id))),cell('Canvas '+fmt(stock('Gudang Canvas',p.id))),dosC(p),cell('Rp. '+fmt(p.purchasePrice),'hrg')]]],`data-edit="${p.id}" data-search="${esc((p.code+' '+p.name).toLowerCase())}"`)).join('')||'<div class="empty">Belum ada produk. Tambahkan produk pertama.</div>'}
function stockPage(){let w=wh();return `${title('Data Stok',w+' • saldo saat ini')}<div class="stat gold"><div class="num">${fmt(allStock(w))}</div><small>Total saldo ${w}</small></div><div class="card"><label class="btn primary" style="display:block;text-align:center">📥 Impor Stok dari Excel<input id="importStock" type="file" accept=".csv,.xlsx,text/csv" hidden></label></div><div class="card"><input id="stockSearch" class="field" placeholder="Cari produk..."></div><div class="card">${stockTable()}</div><div class="card"><b>Buku pergerakan stok terbaru</b><div style="margin-top:10px">${ledgerTable(w)}</div></div>`}
function openMinus(){let m=new Map();db.minusCases.filter(x=>x.active-(x.resolved||0)>0).sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(x=>m.set(x.warehouse+'|'+x.productId,x));return [...m.values()].reverse()}
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID'),unitP=id=>{let p=db.products.find(x=>x.id===id);return p?(Number(p.sellPrice)||Number(p.purchasePrice)||0):0};
function gsum(cls,lab,n,q,v){return `<div class="gs"><div class="r"><small>${lab}</small><small>${n} barang</small></div><div class="r"><b class="${cls}">${cls==='m'?'−':'+'}${fmt(q)} Roll</b><b class="${cls}">${rp(v)}</b></div></div>`}
function gmadd(w,k,id,q){db.gm=db.gm||{};db.gm[w]=db.gm[w]||{minus:{},plus:{}};db.gm[w][k]=db.gm[w][k]||{};db.gm[w][k][id]=Math.round(((db.gm[w][k][id]||0)+q)*1e6)/1e6}
function gmList(k){let w=wh(),L=[];['Gudang Ende','Gudang Canvas'].forEach(x=>{if(w==='Gabungan'||w===x)Object.entries((db.gm&&db.gm[x]&&db.gm[x][k])||{}).forEach(([id,q])=>{if(q>0&&db.products.some(p=>p.id===id))L.push({w:x,id,q})})});return L}
function gmPage(k){let m=k==='minus',L=gmList(k),q=0,v=0;L.forEach(x=>{q+=x.q;v+=x.q*unitP(x.id)});let w=wh(),kr=m?db.transactions.filter(t=>t.gm==='minus'&&t.pay==='Kredit'&&(w==='Gabungan'||t.src===w)):[],krv=kr.reduce((a,t)=>a+Number(t.total||0),0);return `${title(m?'Barang Minus':'Barang Plus','Gudang '+(m?'Minus':'Plus')+' • '+w)}<div class="card">${gsum(m?'m':'p',m?'SALDO GUDANG MINUS':'SALDO GUDANG PLUS',L.length,q,v)}${m?`<div class="gs"><div class="r"><small>TAGIHAN KREDIT BELUM LUNAS</small><small>${kr.length} nota</small></div><div class="r"><b class="m">${rp(krv)}</b></div></div>`:''}${L.map(x=>{let h=unitP(x.id);return blk(esc(pname(x.id)),'',[['1fr 1fr',[cell(esc(x.w)),cell((m?'Saldo −':'Saldo +')+fmt(x.q),m?'mn':'pl')]],['1fr 1fr',[cell(h?'Harga '+rp(h):'Harga belum diisi',h?'':'mut'),cell('Nilai '+rp(x.q*h),m?'mn':'pl')]]])}).join('')||'<div class="empty">Saldo kosong. Saldo terisi saat hasil cek fisik diterapkan.</div>'}</div>`}
function minusPage(){return gmPage('minus')}

ang Canvas'?'selected':''}>Gudang Canvas</option></select></label></div><div id="txBuyerWrap"><label style="display:block;margin-top:10px"><span class="label">Nama pembeli / penanggung jawab</span><input id="txBuyer" class="field" placeholder="Contoh: Budi / Toko Maju"></label></div><div id="txPayWrap"><label style="display:block;margin-top:10px"><span class="label">Status bayar</span><select id="txPay" class="field"><option>Lunas</option><option>Kredit</option></select></label></div><label style="display:block;margin-top:10px"><span class="label">Keterangan</span><input id="txNote" class="field" placeholder="Catatan transaksi"></label><button class="btn primary" id="saveTx" style="width:100%;margin-top:12px">Simpan transaksi</button></div><div class="card"><b>Transaksi terbaru</b><div style="margin-top:10px">${txTable(db.transactions.filter(t=>t.type==='Penjualan'||t.type==='Transfer').slice(-8).reverse())}</div></div>`}

document.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>{TXT=b.dataset.tx;render()});let tt=document.getElementById('txType');if(tt){tt.onchange=()=>{TXT=tt.value;txToggle()};txToggle()}

function delCount(id){let c=db.counts.find(x=>x.id===id);if(!c||c.applied)return;if(!confirm('Hapus hasil hitung '+pname(c.productId)+' ('+c.warehouse+')?\n\nProduk ini kembali ke daftar Belum dihitung. Stok sistem tidak berubah.'))return;db.counts=db.counts.filter(x=>x.id!==id);db.minusCases=db.minusCases.filter(x=>!(x.productId===c.productId&&x.warehouse===c.warehouse&&x.date===c.date));db.plusCases=db.plusCases.filter(x=>!(x.productId===c.productId&&x.warehouse===c.warehouse&&x.date===c.date));db.activities.push({text:'Hasil hitung dihapus: '+pname(c.productId),date:new Date().toLocaleString('id-ID')});save();render()}
function notaModal(id){let t=db.transactions.find(x=>x.id===id);if(!t)return;let h=t.gm==='minus'?'Nota tagihan barang minus':t.gm==='plus'?'Nota penjualan barang plus':t.type==='Penjualan'?'Nota penjualan':'Bukti '+t.type,r=(a,b)=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #e7eaf0;font-size:13px"><span style="color:#788397">${a}</span><span style="text-align:right;font-weight:600">${b}</span></div>`,pay=t.type==='Penjualan';document.getElementById('modalRoot').innerHTML=`<div class="modalback"><div class="modal"><button class="close" onclick="closeModal()">×</button><h3 style="margin:0">${h}</h3><div class="sub">No. ${t.id.slice(0,8).toUpperCase()} • ${esc(t.date)}</div>${r('Gudang',esc(t.warehouse))}${pay?r('Pembeli / penanggung jawab',esc(t.buyer||'-')):''}${r('Keterangan',esc(t.note||'-'))}${r('Barang',esc(t.productName))}${r('Jumlah',fmt(t.qty)+' Roll')}${r('Harga satuan',rp(t.price))}${r('Total','<span style="font-size:17px">'+rp(t.total)+'</span>')}${pay?r('Status bayar','<span style="color:'+(t.pay==='Kredit'?'#c45160':'#21856e')+'">'+(t.pay==='Kredit'?'Kredit (belum lunas)':'Lunas')+'</span>')+`<button class="btn primary" style="width:100%;margin-top:12px" onclick="setPay('${t.id}')">${t.pay==='Kredit'?'Tandai lunas':'Ubah ke kredit'}</button>`:''}</div></div>`}
function setPay(id){let t=db.transactions.find(x=>x.id===id);if(!t)return;t.pay=t.pay==='Kredit'?'Lunas':'Kredit';save();closeModal();render()}
function saveSale(){let g=id=>document.getElementById(id),type=g('txType').value,from=g('txFrom').value,k=from==='Gudang Minus'?'minus':from==='Gudang Plus'?'plus':null;if(type==='Transfer'&&(k||/Minus|Plus/.test(g('txTo').value))){alert('Transfer hanya antara Gudang Ende dan Gudang Canvas.');return}let buyer=g('txBuyer').value.trim(),pay=g('txPay').value;if(type==='Penjualan'){if(!buyer){alert('Isi nama pembeli / penanggung jawab.');return}if(k){let src=g('txSrc').value,id=g('txProduct').value,p=db.products.find(x=>x.id===id),qty=Number(g('txQty').value),price=Number(g('txPrice').value),un=g('txNote').value.trim();if(!p||!(qty>0)){alert('Pilih produk dan jumlah yang valid.');return}let bal=((db.gm&&db.gm[src]&&db.gm[src][k])||{})[id]||0;if(bal<qty){alert('Saldo Gudang '+(k==='minus'?'Minus':'Plus')+' '+src.replace('Gudang ','')+' tidak mencukupi (saldo '+fmt(bal)+').');return}gmadd(src,k,id,-qty);let date=new Date().toLocaleString('id-ID'),t={id:crypto.randomUUID(),type:'Penjualan',gm:k,src,warehouse:'Gudang '+(k==='minus'?'Minus':'Plus')+' ('+src.replace('Gudang ','')+')',from:src,to:'',productId:id,productName:p.name,qty,price,total:qty*price,note:'Barang '+k+' '+src+(un?' - '+un:''),reason:'',person:buyer,buyer,pay,date};db.transactions.push(t);db.activities.push({text:'Penjualan: '+p.name+' ('+t.warehouse+')',date});save();render();alert('Nota tersimpan. Nomor: '+t.id.slice(0,8).toUpperCase());return}}let n=db.transactions.length;saveTransaction();if(type==='Penjualan'&&db.transactions.length>n){let t=db.transactions[db.transactions.length-1];t.buyer=buyer;t.pay=pay;save();render()}}
function go(p){page=p;render();window.scrollTo(0,0)}
function productModal(id){let p=db.products.find(x=>x.id===id)||{code:'',name:'',unit:'Roll',category:'Umum',purchasePrice:0,sellPrice:0,isi:0};document.getElementById('modalRoot').innerHTML=`<div class="modalback"><div class="modal"><button class="close" onclick="closeModal()">×</button><h3>${id?'Edit':'Tambah'} Produk</h3><div class="formgrid"><label><span class="label">Kode produk *</span><input id="mCode" class="field" value="${esc(p.code)}"></label><label><span class="label">Satuan *</span><input id="mUnit" class="field" value="${esc(p.unit)}" placeholder="Roll, Dos, Pcs"></label></div><label style="display:block;margin-top:10px"><span class="label">Nama produk *</span><input id="mName" class="field" value="${esc(p.name)}"></label><div class="formgrid" style="margin-top:10px"><label><span class="label">Kategori</span><input id="mCategory" class="field" value="${esc(p.category)}"></label><label><span class="label">Harga beli</span><input id="mBuy" class="field" type="number" min="0" value="${Number(p.purchasePrice||0)}"></label><label><span class="label">Harga jual</span><input id="mSell" class="field" type="number" min="0" value="${Number(p.sellPrice||0)}"></label><label><span class="label">Isi per Dos (Roll)</span><input id="mIsi" class="field" type="number" min="0" step="any" value="${Number(p.isi||0)}"></label></div><div class="actions" style="margin-top:14px"><button class="btn primary" style="flex:1" onclick="saveProduct('${id||''}')">Simpan Produk</button>${id?`<button class="btn danger" onclick="deleteProduct('${id}')">Hapus</button>`:''}</div></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function stockAdjustModal(id,w){let p=db.products.find(x=>x.id===id);w=w||wh();if(!p||w==='Gabungan'){alert('Pilih salah satu gudang terlebih dahulu.');return}let current=stock(w,id);document.getElementById('modalRoot').innerHTML=`<div class="modalback"><div class="modal"><button class="close" onclick="closeModal()">×</button><h3>Penyesuaian Stok</h3><b>${esc(p.name)}</b><div class="sub">${esc(w)} • Saldo sekarang: ${fmt(current)} ${esc(p.unit)}</div><label style="display:block;margin-top:12px"><span class="label">Jenis perubahan</span><select id="adjType" class="field"><option value="set">Tetapkan saldo akhir</option><option value="in">Stok masuk (+)</option><option value="out">Stok keluar (-)</option></select></label><label style="display:block;margin-top:10px"><span class="label">Jumlah</span><input id="adjQty" class="field" type="number" min="0" step="any" value="0"></label><label style="display:block;margin-top:10px"><span class="label">Alasan / referensi</span><input id="adjReason" class="field" placeholder="Contoh: stok awal / koreksi berdasarkan dokumen"></label><button class="btn primary" style="width:100%;margin-top:14px" onclick="applyStockAdjust('${id}','${w}')">Simpan perubahan stok</button></div></div>`}
function applyStockAdjust(id,w){let q=Number(document.getElementById('adjQty').value),type=document.getElementById('adjType').value,reason=document.getElementById('adjReason').value.trim();if(!Number.isFinite(q)||q<0){alert('Jumlah harus angka nol atau lebih.');return}let before=stock(w,id),after=type==='set'?q:type==='in'?before+q:before-q;if(after<0){alert('Stok keluar melebihi saldo yang tersedia.');return}let delta=after-before;db.stocks[w][id]=after;let p=db.products.find(x=>x.id===id),date=new Date().toLocaleString('id-ID');db.movements.push({id:crypto.randomUUID(),productId:id,warehouse:w,before,delta,after,type:'Penyesuaian manual',reason,date});db.activities.push({text:'Penyesuaian stok '+p.name+' ('+w+')',date});save();closeModal();render()}

function saveProduct(id){let code=document.getElementById('mCode').value.trim(),name=document.getElementById('mName').value.trim(),unit=document.getElementById('mUnit').value.trim(),category=document.getElementById('mCategory').value.trim()||'Umum',purchasePrice=Number(document.getElementById('mBuy').value||0),sellPrice=Number(document.getElementById('mSell').value||0),isi=Number(document.getElementById('mIsi').value||0);if(isi<0){alert('Isi per Dos tidak boleh negatif.');return}if(!code||!name||!unit){alert('Kode, nama, dan satuan wajib diisi.');return}if(db.products.some(p=>p.code.toLowerCase()===code.toLowerCase()&&p.id!==id)){alert('Kode produk sudah digunakan.');return}if(purchasePrice<0||sellPrice<0){alert('Harga tidak boleh negatif.');return}if(id){Object.assign(db.products.find(p=>p.id===id),{code,name,unit,category,purchasePrice,sellPrice,isi})}else{let pid=crypto.randomUUID();db.products.push({id:pid,code,name,unit,category,purchasePrice,sellPrice,isi});db.stocks['Gudang Ende'][pid]=0;db.stocks['Gudang Canvas'][pid]=0}db.activities.push({text:(id?'Produk diperbarui: ':'Produk ditambahkan: ')+name,date:new Date().toLocaleString('id-ID')});save();closeModal();render()}
function deleteProduct(id){let p=db.products.find(x=>x.id===id);if(!p)return;if(stock('Gudang Ende',id)!==0||stock('Gudang Canvas',id)!==0){alert('Produk tidak bisa dihapus karena masih memiliki stok. Kosongkan stok atau arsipkan melalui proses yang benar terlebih dahulu.');return}if(!confirm('Hapus produk '+p.name+'? Riwayat transaksi tetap dipertahankan.'))return;db.products=db.products.filter(x=>x.id!==id);save();closeModal();render()}
function saveTransaction(){let type=document.getElementById('txType').value,from=document.getElementById('txFrom').value,to=document.getElementById('txTo').value,id=document.getElementById('txProduct').value,p=db.products.find(x=>x.id===id),qty=Number(document.getElementById('txQty').value),price=Number(document.getElementById('txPrice').value),note=document.getElementById('txNote').value,reason='',person='';if(type==='Tanpa Nota'){reason=document.getElementById('txReason').value;person=document.getElementById('txPerson').value.trim();if(!person){alert('Isi nama orang / toko yang terkait.');return}note=reason+' - '+person}if(!p||qty<=0){alert('Pilih produk dan jumlah yang valid.');return}if(type==='Transfer'){if(from===to){alert('Gudang asal dan tujuan harus berbeda.');return}if(stock(from,id)<qty){alert('Stok gudang asal tidak mencukupi.');return}db.stocks[from][id]-=qty;db.stocks[to][id]+=qty}else if(type==='Penjualan'||type==='Tanpa Nota'){if(stock(from,id)<qty){alert('Stok tidak mencukupi.');return}db.stocks[from][id]-=qty}else if(type==='Pembelian'){db.stocks[from][id]+=qty}let t={id:crypto.randomUUID(),type,warehouse:from,from,to,productId:id,productName:p.name,qty,price,total:qty*price,note,reason,person,date:new Date().toLocaleString('id-ID')};db.transactions.push(t);if(type==='Transfer'){db.movements.push({id:crypto.randomUUID(),productId:id,warehouse:from,before:stock(from,id)+qty,delta:-qty,after:stock(from,id),type:'Transfer keluar',reason:'Transfer ke '+to,date:t.date});db.movements.push({id:crypto.randomUUID(),productId:id,warehouse:to,before:stock(to,id)-qty,delta:qty,after:stock(to,id),type:'Transfer masuk',reason:'Transfer dari '+from,date:t.date})}else{let delta=type==='Pembelian'?qty:-qty;db.movements.push({id:crypto.randomUUID(),productId:id,warehouse:from,before:stock(from,id)-delta,delta,after:stock(from,id),type,reason:note,date:t.date})}db.activities.push({text:type+': '+p.name,date:t.date});save();render();alert('Transaksi berhasil disimpan. Nomor referensi: '+t.id.slice(0,8).toUpperCase())}
function csv(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function download(name,content,type='text/csv'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function parseCSV(t){t=t.replace(/^\uFEFF/,'');let l=t.split(/\r?\n/)[0],d=[';','\t',','].map(x=>[x,l.split(x).length]).sort((a,b)=>b[1]-a[1])[0][0],rows=[],row=[],cur='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++}else q=false}else cur+=c}else if(c=='"')q=true;else if(c==d){row.push(cur);cur=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}else cur+=c}if(cur!==''||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()!==''))}
function readCSV(file,cb){if(!file)return;let r=new FileReader();r.onload=()=>cb(parseCSV(r.result));r.readAsText(file)}
function compareRows(rows){let headers=rows[0].map(x=>x.toLowerCase().trim()),ci=headers.indexOf('kode_produk'),si=headers.indexOf('stok');if(ci<0||si<0){alert('CSV wajib memiliki kolom kode_produk dan stok.');return}let w=document.getElementById('compareWh').value,body=rows.slice(1).map(r=>{let p=db.products.find(x=>x.code===r[ci]),excel=Number(r[si]),sys=p?(w==='Gabungan'?totalStock(p.id):stock(w,p.id)):null;return {code:r[ci],name:p?.name||'Produk tidak ditemukan',excel,sys,diff:p?excel-sys:null}});document.getElementById('compareResult').innerHTML='<div style="margin-top:12px">'+(body.map(x=>blk(esc(x.name),x.sys===null?esc(x.code):'',[['1fr 1fr 1fr',[cell('Excel '+fmt(x.excel)),cell('Sistem '+(x.sys===null?'—':fmt(x.sys))),x.diff===null?cell('Tidak ditemukan','ok'):dcell(x.diff)]]])).join('')||'<div class="empty">Tidak ada data.</div>')+'</div>'}
const td=(v,c='')=>`<td class="${c}">${v}</td>`,pname=id=>db.products.find(p=>p.id===id)?.name||'-',r1=c=>`<tr class="s">${c.join('')}</tr>`,r2=(c,sub)=>`<tr class="a">${c.join('')}</tr><tr class="b"><td colspan="${c.length}"><div class="sub2">${sub}</div></td></tr>`,dosTxt=p=>p.isi>0?`<span class="dos">1Dos = ${fmt(p.isi)}Roll</span>`:'<span class="mut">Isi belum diisi</span>';
const cell=(v,c='',at='')=>`<div class="${c}" ${at}>${v}</div>`,dosC=p=>p.isi>0?cell('1Dos = '+fmt(p.isi)+'Roll','dos'):cell('Isi belum diisi','mut'),dcell=d=>d>0?cell('Plus +'+fmt(d),'pl'):d<0?cell('Minus −'+fmt(-d),'mn'):cell('Sesuai 0','ok');
function blk(n,k,rows,at=''){return `<div class="bk" ${at}><div class="bt">${n}</div>${k?`<div class="bk2">${k}</div>`:''}${rows.map(r=>`<div class="br" style="grid-template-columns:${r[0]}">${r[1].join('')}</div>`).join('')}</div>`}
function pt(head,rows,w){return `<div class="tablewrap"><table class="pt"><colgroup>${w.map(x=>`<col style="width:${x}%">`).join('')}</colgroup><thead><tr>${head.map((x,i)=>`<th class="${i?'r':''}">${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`}
